<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <title>我的連結首頁</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
            background: #0d1117;
            color: #e6edf3;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            --border: #30363d;
            --muted: #8b949e;
            --link: #58a6ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 42px 24px 64px;
        }

        .page {
            width: min(100%, 960px);
            margin: 0 auto;
        }

        .repo-heading {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 22px;
            border-bottom: 1px solid var(--border);
        }

        .repo-mark {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border: 1px solid #424b55;
            border-radius: 50%;
            background: linear-gradient(145deg, #27364a, #16202c);
            color: #79c0ff;
            font-size: 20px;
        }

        h1 {
            margin: 0;
            font-size: 21px;
            font-weight: 600;
            letter-spacing: -.02em;
        }

        .visibility {
            padding: 2px 8px;
            border: 1px solid #424b55;
            border-radius: 20px;
            color: var(--muted);
            font-size: 12px;
        }

        .intro {
            margin: 9px 0 26px;
            color: var(--muted);
            font-size: 14px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .branch {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 34px;
            padding: 0 13px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #21262d;
            color: #e6edf3;
            font-size: 13px;
            font-weight: 600;
        }

        .toolbar-note {
            color: var(--muted);
            font-size: 13px;
        }

        .file-list {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 7px;
        }

        .list-header,
        .file-row {
            display: grid;
            grid-template-columns: minmax(150px, 1fr) minmax(180px, 1.2fr) minmax(100px, .45fr);
            align-items: center;
        }

        .list-header {
            min-height: 49px;
            padding: 0 16px;
            background: #161b22;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        .file-row {
            min-height: 49px;
            border-top: 1px solid var(--border);
        }

        .file-row:hover {
            background: #161b22;
        }

        .file-row a {
            display: flex;
            min-width: 0;
            min-height: 49px;
            align-items: center;
            padding: 10px 16px;
            color: var(--link);
            font-size: 14px;
            text-decoration: none;
        }

        .file-row a:hover {
            text-decoration: underline;
        }

        .file-name {
            gap: 10px;
            color: #e6edf3 !important;
            font-weight: 600;
        }

        .file-name:hover {
            color: var(--link) !important;
        }

        .file-icon {
            flex: 0 0 auto;
            color: var(--muted);
        }

        .file-description {
            overflow: hidden;
            color: #8b949e !important;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-updated {
            justify-content: flex-end;
            color: var(--muted) !important;
            font-size: 13px !important;
            white-space: nowrap;
        }

        .readme {
            margin-top: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 7px;
        }

        .readme-heading {
            display: flex;
            align-items: center;
            gap: 9px;
            min-height: 49px;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600;
        }

        .readme-content {
            display: grid;
            min-height: 170px;
            place-items: center;
            padding: 26px;
            text-align: center;
        }

        .readme-content a {
            color: #e6edf3;
            text-decoration: none;
        }

        .readme-content a:hover {
            color: var(--link);
        }

        .readme-content h2 {
            margin: 10px 0 6px;
            font-size: 19px;
        }

        .readme-content p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        .readme-icon {
            color: var(--muted);
        }

        a:focus-visible {
            outline: 2px solid #58a6ff;
            outline-offset: -2px;
        }

        @media (max-width: 620px) {
            body {
                padding: 28px 14px 40px;
            }

            .list-header,
            .file-row {
                grid-template-columns: minmax(130px, 1fr) minmax(120px, .85fr);
            }

            .list-header span:last-child,
            .file-updated {
                display: none;
            }

            .file-row a {
                padding: 10px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <header class="repo-heading">
            <div class="repo-mark" aria-hidden="true">✦</div>
            <h1>機器學習互動網頁_目錄</h1>
            <span class="visibility">公開</span>
        </header>
        <p class="intro">廣告位，還沒想到放什麼。</p>

        <div class="toolbar">
            <span class="branch"><span aria-hidden="true">⑂</span> 我的書籤</span>
            <span class="toolbar-note">每個檔名、說明與日期欄位都可以設定自己的超連結</span>
        </div>

        <section class="file-list" aria-label="連結清單">
            <div class="list-header" aria-hidden="true">
                <span>名稱</span>
                <span>說明</span>
                <span style="text-align: right;">最近更新</span>
            </div>

            <!-- 新增連結：複製一個 file-row，並修改各個連結的 href 與文字。 -->
            <div class="file-row">
                <a class="file-name" >😊 </a>

                <a class="file-updated" href="A01-1.html">開啟連結 →</a>
            </div>
            <div class="file-row">
                <a class="file-name" >😊 </a>
                <a class="file-description" href="catanddog.html">貓狗辨識輸送帶 × 混淆矩陣實驗室</a>
                <a class="file-updated" href="catanddog.html">開啟連結 →</a>
            </div>
            <div class="file-row">
                <a class="file-name" >😊 </a>
                <a class="file-description" href="ML01-1.html">機器學習互動實驗室</a>
                <a class="file-updated" href="ML01-1.html">開啟連結 →</a>
            </div>
            <div class="file-row">
                <a class="file-name" >😊 </a>
                <a class="file-description" href="https://developers.google.com/machine-learning?hl=zh-tw">Google 機器學習課程</a>
                <a class="file-updated" href="https://developers.google.com/machine-learning?hl=zh-tw">開啟連結 →</a>
            </div>            
        </section>

        <section class="readme" aria-label="首頁介紹">
            <div class="readme-heading">
                <span class="readme-icon" aria-hidden="true">▱</span>
                首頁介紹
            </div>
            <div class="readme-content">
                <a href="index.html">
                    <span class="readme-icon" aria-hidden="true">▱</span>
                    <h2>我的網頁入口</h2>
                    <p>把上方每個格子的網址改成你想收藏的超連結。</p>
                </a>
            </div>
        </section>
    </main>
</body>

</html>
